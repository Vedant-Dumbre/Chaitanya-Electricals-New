<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Photos | Chaitanya Electricals</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f7fa;
            font-family: Arial, sans-serif;
        }

        .gallery-header {
            background: #172b4d;
            color: white;
            padding: 35px 15px;
            text-align: center;
        }

        .gallery-header h1 {
            font-weight: 700;
        }

        .photo-card {
            border-radius: 12px;
            overflow: hidden;
            background: white;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
            transition: transform 0.3s;
            cursor: pointer;
        }

        .photo-card:hover {
            transform: translateY(-5px);
        }

        .photo-card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
        }

        .photo-caption {
            padding: 12px;
            text-align: center;
            font-weight: 600;
        }

        .back-btn {
            margin-top: 25px;
        }

        /* Modal Grid & Scrollable Styling */
        .modal-body-scroll {
            max-height: 75vh;
            overflow-y: auto;
        }

        .thumb-item {
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            transition: transform 0.2s;
        }

        .thumb-item:hover {
            transform: scale(1.03);
        }

        .thumb-item img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }
    </style>
</head>

<body>

    <div class="gallery-header">
        <h1>Chaitanya Electricals</h1>
        <p>Our Store, Products & Work Gallery</p>
    </div>

    <div class="container py-5">

        <div class="row g-4">

            <!-- 1. Our Store Card (Click to open grid view) -->
            <div class="col-6 col-md-4">
                <div class="photo-card" onclick="openStoreGallery()">
                    <img id="mainStoreCover" src="" alt="Our Store">
                    <div class="photo-caption">Our Store</div>
                </div>
            </div>

            <!-- 2. Shop View Card -->
            <div class="col-6 col-md-4">
                <div class="photo-card">
                    <img src="photos/shop-2.jpg" alt="Shop View">
                    <div class="photo-caption">Shop View</div>
                </div>
            </div>

            <!-- 3. Electrical Work Card -->
            <div class="col-6 col-md-4">
                <div class="photo-card">
                    <img src="photos/fitting-1.jpg" alt="Electrical Fitting">
                    <div class="photo-caption">Electrical Work</div>
                </div>
            </div>

            <!-- 4. Fitting Services Card -->
            <div class="col-6 col-md-4">
                <div class="photo-card">
                    <img src="photos/fitting-2.jpg" alt="Fitting Work">
                    <div class="photo-caption">Fitting Services</div>
                </div>
            </div>

            <!-- 5. Our Products Card -->
            <div class="col-6 col-md-4">
                <div class="photo-card">
                    <img src="photos/products-1.jpg" alt="Electrical Products">
                    <div class="photo-caption">Our Products</div>
                </div>
            </div>

        </div>

        <div class="text-center back-btn">
            <a href="index.html" class="btn btn-primary">
                ← Back to Home
            </a>
        </div>

    </div>

    <!-- Scrollable Grid Modal View -->
    <div class="modal fade" id="storeGalleryModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Our Store Photos (<span id="photoCount">0</span> Photos)</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body modal-body-scroll p-4">
                    <div class="row g-3" id="galleryGrid">
                        <!-- Small photo icons will load dynamically here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // All photo file names from your screenshot added automatically
        const storePhotos = [
            "IMG-20250213-WA0027.jpg",
            "20260608_062845.jpg",
            "20260608_062916.jpg",
            "Colors-Best-dealer.jpg",
            "IMG-20230424-WA0003.jpg",
            "IMG-20230424-WA0004.jpg",
            "IMG-20230424-WA0005.jpg",
            "WhatsApp Image 2026-08-15 at 6.11.04 PM.jpg",
            "WhatsApp Image 2026-08-15 at 6.11.06 PM.jpg",
            "WhatsApp Image 2026-08-15 at 6.11.07 PM.jpg",
            "WhatsApp Image 2026-08-15 at 6.11.08 PM.jpg",
            "WhatsApp Image1 2026-08-15 at 6.11.08 PM.jpg"
        ];

        // Set the main card cover automatically to the first photo
        if (storePhotos.length > 0) {
            document.getElementById('mainStoreCover').src = `Photos/${storePhotos[0]}`;
        }

        const storeGalleryModal = new bootstrap.Modal(document.getElementById('storeGalleryModal'));

        function openStoreGallery() {
            const gridContainer = document.getElementById('galleryGrid');
            document.getElementById('photoCount').textContent = storePhotos.length;
            let content = '';

            storePhotos.forEach((photo, index) => {
                content += `
                    <div class="col-6 col-sm-4 col-md-3">
                        <div class="thumb-item">
                            <a href="Photos/${photo}" target="_blank">
                                <img src="Photos/${photo}" alt="Store Photo ${index + 1}">
                            </a>
                        </div>
                    </div>
                `;
            });

            gridContainer.innerHTML = content;
            storeGalleryModal.show();
        }
    </script>

</body>
</html>
