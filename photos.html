<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Achievements | Chaitanya Electricals</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            background: #f5f7fa;
            font-family: Arial, sans-serif;
        }

        /* Header */

        .gallery-header {
            background: #172b4d;
            color: white;
            padding: 35px 15px;
            text-align: center;
        }

        .gallery-header h1 {
            font-weight: 700;
        }

        .gallery-header p {
            margin-bottom: 0;
            color: #dce6f5;
        }

        /* Gallery */

        .section-title {
            color: #172b4d;
            font-weight: 700;
        }

        .photo-card {
            height: 100%;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
            transition: 0.3s ease;
        }

        .photo-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .photo-card img {
            width: 100%;
            height: 300px;
            object-fit: contain;
            background: #eeeeee;
            padding: 8px;
            cursor: pointer;
        }

        .photo-caption {
            padding: 14px 8px;
            text-align: center;
            font-weight: 600;
            color: #172b4d;
        }

        /* Navigation */

        .back-btn {
            margin-top: 35px;
        }

        .back-btn a {
            padding: 10px 25px;
            border-radius: 8px;
        }

        /* Mobile */

        @media(max-width: 576px) {

            .photo-card img {
                height: 220px;
            }

            .photo-caption {
                font-size: 13px;
            }

        }

    </style>

</head>

<body>

    <!-- Header -->

    <div class="gallery-header">

        <h1>
            <i class="bi bi-trophy-fill me-2"></i>
            Chaitanya Electricals
        </h1>

        <p>Our Achievements & Recognition</p>

    </div>


    <!-- Achievements Section -->

    <div class="container py-5">

        <div class="text-center mb-5">

            <h2 class="section-title">
                Our Achievements
            </h2>

            <p class="text-muted">
                Celebrating our achievements, recognition
                and memorable moments.
            </p>

        </div>


        <div class="row g-4">


            <!-- Achievement 1 -->

            <div class="col-6 col-md-3">

                <div class="photo-card">

                    <a href="Photos/Colors-Best-dealer.jpg"
                       target="_blank">

                        <img src="Photos/Colors-Best-dealer.jpg"
                             alt="Colors Best Dealer Award">

                    </a>

                    <div class="photo-caption">
                        Colors Best Dealer Award
                    </div>

                </div>

            </div>


            <!-- Achievement 2 -->

            <div class="col-6 col-md-3">

                <div class="photo-card">

                    <a href="Photos/IMG-20230424-WA0003.jpg"
                       target="_blank">

                        <img src="Photos/IMG-20230424-WA0003.jpg"
                             alt="Dealer Recognition">

                    </a>

                    <div class="photo-caption">
                        Dealer Recognition
                    </div>

                </div>

            </div>


            <!-- Achievement 3 -->

            <div class="col-6 col-md-3">

                <div class="photo-card">

                    <a href="Photos/IMG-20230424-WA0004.jpg"
                       target="_blank">

                        <img src="Photos/IMG-20230424-WA0004.jpg"
                             alt="Award Ceremony">

                    </a>

                    <div class="photo-caption">
                        Award Ceremony
                    </div>

                </div>

            </div>


            <!-- Achievement 4 -->

            <div class="col-6 col-md-3">

                <div class="photo-card">

                    <a href="Photos/IMG-20230424-WA0005.jpg"
                       target="_blank">

                        <img src="Photos/IMG-20230424-WA0005.jpg"
                             alt="Recognition Moment">

                    </a>

                    <div class="photo-caption">
                        Recognition Moment
                    </div>

                </div>

            </div>


        </div>


        <!-- Back to Home -->

        <div class="text-center back-btn">

            <a href="index.html" class="btn btn-primary">

                <i class="bi bi-arrow-left me-2"></i>
                Back to Home

            </a>

        </div>

    </div>

</body>

</html>
