<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Photos | Chaitanya Electricals</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f5f7fa;
            font-family: Arial, sans-serif;
        }

        .gallery-header {
            background: #172b4d;
            color: white;
            padding: 35px 15px;
            text-align: center;
        }

        .gallery-header h1 {
            font-weight: 700;
        }

        .photo-card {
            border-radius: 12px;
            overflow: hidden;
            background: white;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .photo-card:hover {
            transform: translateY(-5px);
        }

        .photo-card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            cursor: pointer;
        }

        .photo-caption {
            padding: 12px;
            text-align: center;
            font-weight: 600;
        }

        .back-btn {
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <div class="gallery-header">
        <h1>Chaitanya Electricals</h1>
        <p>Our Store, Products & Work Gallery</p>
    </div>

    <div class="container py-5">

        <div class="row g-4">

            <!-- Achievement 1 -->
            <div class="col-6 col-md-4">
                <div class="photo-card">
                    <a href="Photos/Colors-Best-dealer.jpg" target="_blank">
                        <img src="Photos/Colors-Best-dealer.jpg"
                             alt="Colors Best Dealer Award">
                    </a>
                    <div class="photo-caption">
                        Colors Best Dealer Award
                    </div>
                </div>
            </div>

            <!-- Achievement 2 -->
            <div class="col-6 col-md-4">
                <div class="photo-card">
                    <a href="Photos/IMG-20230424-WA0003.jpg" target="_blank">
                        <img src="Photos/IMG-20230424-WA0003.jpg"
                             alt="Dealer Recognition">
                    </a>
                    <div class="photo-caption">
                        Dealer Recognition
                    </div>
                </div>
            </div>

            <!-- Achievement 3 -->
            <div class="col-6 col-md-4">
                <div class="photo-card">
                    <a href="Photos/IMG-20230424-WA0004.jpg" target="_blank">
                        <img src="Photos/IMG-20230424-WA0004.jpg"
                             alt="Award Ceremony">
                    </a>
                    <div class="photo-caption">
                        Award Ceremony
                    </div>
                </div>
            </div>

            <!-- Achievement 4 -->
            <div class="col-6 col-md-4">
                <div class="photo-card">
                    <a href="Photos/IMG-20230424-WA0005.jpg" target="_blank">
                        <img src="Photos/IMG-20230424-WA0005.jpg"
                             alt="Recognition Moment">
                    </a>
                    <div class="photo-caption">
                        Recognition Moment
                    </div>
                </div>
            </div>

            <!-- Photo 2 - Shop View (Unchanged) -->
            <div class="col-6 col-md-4">
                <div class="photo-card">
                    <a href="Photos/shop-2.jpg" target="_blank">
                        <img src="Photos/shop-2.jpg" alt="Shop">
                    </a>
                    <div class="photo-caption">Shop View</div>
                </div>
            </div>

            <!-- Photo 3 - Electrical Work (Unchanged) -->
            <div class="col-6 col-md-4">
                <div class="photo-card">
                    <a href="Photos/fitting-1.jpg" target="_blank">
                        <img src="Photos/fitting-1.jpg" alt="Electrical Fitting">
                    </a>
                    <div class="photo-caption">Electrical Work</div>
                </div>
            </div>

            <!-- Photo 4 - Fitting Services (Unchanged) -->
            <div class="col-6 col-md-4">
                <div class="photo-card">
                    <a href="Photos/fitting-2.jpg" target="_blank">
                        <img src="Photos/fitting-2.jpg" alt="Fitting Work">
                    </a>
                    <div class="photo-caption">Fitting Services</div>
                </div>
            </div>

            <!-- Photo 5 - Products (Unchanged) -->
            <div class="col-6 col-md-4">
                <div class="photo-card">
                    <a href="Photos/products-1.jpg" target="_blank">
                        <img src="Photos/products-1.jpg" alt="Electrical Products">
                    </a>
                    <div class="photo-caption">Our Products</div>
                </div>
            </div>

        </div>

        <div class="text-center back-btn">
            <a href="index.html" class="btn btn-primary">
                ← Back to Home
            </a>
        </div>

    </div>

</body>
</html>
